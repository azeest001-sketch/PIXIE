<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        background: #000;
      }

      canvas {
        position: fixed;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="scroll-sequence"></canvas>
    <div id="scroll-space"></div>
    <script>
      const START_FRAME = 21;
      const END_FRAME = 181;
      const FRAME_COUNT = END_FRAME - START_FRAME + 1;
      const PX_PER_FRAME = 56;
      const LERP = 0.18;

      const canvas = document.getElementById("scroll-sequence");
      const space = document.getElementById("scroll-space");
      const ctx = canvas.getContext("2d", { alpha: false });
      const frames = new Array(FRAME_COUNT);

      let targetIndex = 0;
      let currentIndex = 0;
      let lastDrawn = -1;

      function frameSrc(n) {
        return `frames_vid/ezgif-frame-${String(n).padStart(3, "0")}.jpg`;
      }

      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.floor(window.innerWidth * dpr);
        canvas.height = Math.floor(window.innerHeight * dpr);
        space.style.height = `${window.innerHeight + FRAME_COUNT * PX_PER_FRAME}px`;
        lastDrawn = -1;
        drawFrame(currentIndex);
      }

      function loadFrames() {
        for (let i = 0; i < FRAME_COUNT; i++) {
          const img = new Image();
          img.decoding = "async";
          img.onload = () => {
            if (Math.round(currentIndex) === i) {
              lastDrawn = -1;
              drawFrame(currentIndex);
            }
          };
          img.src = frameSrc(START_FRAME + i);
          frames[i] = img;
        }
      }

      function scrollProgress() {
        const max = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
        return Math.min(1, Math.max(0, window.scrollY / max));
      }

      function drawCover(img) {
        if (!img || !img.complete || !img.naturalWidth) return false;
        const cw = canvas.width;
        const ch = canvas.height;
        if (!cw || !ch) return false;
        const ir = img.naturalWidth / img.naturalHeight;
        const cr = cw / ch;
        let dw, dh, dx, dy;
        if (ir > cr) {
          dh = ch;
          dw = ch * ir;
          dx = (cw - dw) / 2;
          dy = 0;
        } else {
          dw = cw;
          dh = cw / ir;
          dx = 0;
          dy = (ch - dh) / 2;
        }
        ctx.drawImage(img, dx, dy, dw, dh);
        return true;
      }

      function drawFrame(index) {
        const i = Math.round(Math.min(FRAME_COUNT - 1, Math.max(0, index)));
        if (i === lastDrawn) return;
        if (drawCover(frames[i])) lastDrawn = i;
      }

      function tick() {
        targetIndex = scrollProgress() * (FRAME_COUNT - 1);
        currentIndex += (targetIndex - currentIndex) * LERP;
        if (Math.abs(targetIndex - currentIndex) < 0.002) currentIndex = targetIndex;
        drawFrame(currentIndex);
        requestAnimationFrame(tick);
      }

      window.addEventListener("resize", resize, { passive: true });
      resize();
      loadFrames();
      requestAnimationFrame(tick);
    </script>
  </body>
</html>
